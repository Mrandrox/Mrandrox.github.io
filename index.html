<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Website oficial da Mrandrox." />
    <meta name="google-site-verification" content="qHJQM-PnUu1wG_BTwta6EMzFOAvDKZdBoqpFjHdtDyg" />
    <meta name="google-site-verification" content="bPW7LicpGRUzI3nVjcIrPMrookaf2QZpqF84tjqL8Og" />
    <title>Mrandrox</title>
    <style>
      :root {
        --bg: #0b1020;
        --bg-soft: #111827;
        --panel: rgba(17, 24, 39, 0.9);
        --primary: #60a5fa;
        --primary-strong: #3b82f6;
        --text: #e5e7eb;
        --muted: #cbd5e1;
        --border: rgba(148, 163, 184, 0.2);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at top, #172554 0%, var(--bg) 45%);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
        text-align: center;
      }

      .card {
        width: min(900px, 90vw);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 48px 28px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      }

      .badge {
        display: inline-block;
        background: rgba(96, 165, 250, 0.12);
        border: 1px solid rgba(96, 165, 250, 0.3);
        color: var(--primary);
        padding: 8px 14px;
        border-radius: 999px;
        font-size: 0.82rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-bottom: 18px;
      }

      h1 {
        margin: 0 0 18px;
        font-size: clamp(2.2rem, 4vw, 4rem);
        line-height: 1.1;
      }

      p {
        margin: 0 auto 20px;
        max-width: 700px;
        color: var(--muted);
        font-size: 1.08rem;
        line-height: 1.7;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        justify-content: center;
        margin-top: 28px;
      }

      .button {
        display: inline-block;
        text-decoration: none;
        padding: 12px 20px;
        border-radius: 10px;
        border: 1px solid rgba(96, 165, 250, 0.35);
        background: var(--primary-strong);
        color: white;
        font-weight: 700;
        transition: 0.2s ease;
      }

      .button.secondary {
        background: transparent;
        border-color: var(--border);
      }

      .button:hover {
        opacity: 0.92;
        transform: translateY(-1px);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">Mrandrox</div>
      <h1>Website oficial</h1>
      <p>
        Esta página foi criada para servir como referência pública e facilitar a
        validação de identidade e credibilidade no Google Play Console.
      </p>
      <p>
        Atualize os dados de contato e informações do aplicativo conforme o
        projeto evolve.
      </p>

      <div class="actions">
        <a class="button" href="https://github.com/Mrandrox" target="_blank" rel="noreferrer">GitHub</a>
        <a class="button secondary" href="mailto:contato@mrandrox.com">Contato</a>
      </div>
    </main>
  </body>
</html>
